<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Empire: Ultimate - Финансовый Магнат</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="https://d1csarkz8obe9u.cloudfront.net/posterpreviews/logo-design-template-7b59aa2aee8a97a9eefe8b8571955ec2_screen.jpg?ts=1749019222">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;     /* Синий */
            --success: #10b981;     /* Зеленый */
            --warning: #f59e0b;     /* Золотой */
            --danger: #ef4444;      /* Красный */
            --purple: #8b5cf6;      /* Фиолетовый */
            --pink: #ec4899;        /* Розовый */
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            --glow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }

        body {
            background: radial-gradient(circle at top center, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* Анимация фона */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%233b82f6' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            z-index: -1;
        }

        .app-container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* HEADER & NAV */
        .header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 30px;
            position: sticky;
            top: 10px;
            z-index: 100;
            box-shadow: var(--shadow-lg);
        }

        .nav-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none; /* Firefox */
        }
        .nav-container::-webkit-scrollbar { display: none; } /* Chrome */

        .nav-tab {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .nav-tab:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: white;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
            border: none;
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 100px; height: 100px;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.05));
            border-radius: 0 0 0 100%;
        }

        .stat-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .stat-value { font-size: 2.2rem; font-weight: 800; color: var(--text-main); letter-spacing: -1px; }
        .stat-limit { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }
        .progress-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.5s ease; }

        /* CLICKER */
        .click-area {
            display: flex;
            justify-content: center;
            margin: 50px 0;
            perspective: 1000px;
        }

        .main-btn {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4f46e5, #1e1b4b);
            border: 8px solid rgba(255, 255, 255, 0.05);
            box-shadow:
                0 0 60px rgba(79, 70, 229, 0.4),
                inset 0 10px 20px rgba(255, 255, 255, 0.2),
                inset 0 -10px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .main-btn:active { transform: scale(0.95); box-shadow: 0 0 30px rgba(79, 70, 229, 0.2); }
        .main-btn i { font-size: 4rem; color: white; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .main-btn span { font-size: 1.2rem; font-weight: 700; color: rgba(255,255,255,0.9); }

        /* UPGRADES */
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-size: 1.5rem; margin-bottom: 20px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }

        .upgrades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.15); }

        .card-header { display: flex; gap: 15px; margin-bottom: 15px; }
        .card-icon {
            width: 60px; height: 60px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card-info h3 { font-size: 1.1rem; margin-bottom: 4px; }
        .card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

        .card-stats {
            display: flex; justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 10px; border-radius: 8px;
            margin-bottom: 15px;
        }
        .stat-box { text-align: center; }
        .stat-box small { display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-box strong { font-size: 1rem; color: var(--text-main); }

        .buy-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }

        .buy-btn:not(:disabled):hover { filter: brightness(1.1); transform: scale(1.02); }
        .buy-btn:not(:disabled):active { transform: scale(0.98); }
        .buy-btn:disabled { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.2); cursor: not-allowed; }

        /* Floating Text Animation */
        .floating-text {
            position: absolute;
            color: var(--success);
            font-weight: 800;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        /* Color Themes for Categories */
        .theme-blue .card-icon { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .theme-blue .buy-btn { background: #3b82f6; color: white; }

        .theme-green .card-icon { background: linear-gradient(135deg, #10b981, #059669); }
        .theme-green .buy-btn { background: #10b981; color: white; }

        .theme-orange .card-icon { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .theme-orange .buy-btn { background: #f59e0b; color: white; }

        .theme-purple .card-icon { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .theme-purple .buy-btn { background: #8b5cf6; color: white; }

        .theme-pink .card-icon { background: linear-gradient(135deg, #ec4899, #db2777); }
        .theme-pink .buy-btn { background: #ec4899; color: white; }

        /* Notification */
        #notification-area {
            position: fixed; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px; z-index: 2000;
        }
        .notify-toast {
            background: rgba(30, 41, 59, 0.95);
            border-left: 4px solid var(--success);
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideInRight 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
            min-width: 250px;
        }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; pointer-events: none; } }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr; }
            .nav-tab { padding: 10px 15px; font-size: 0.9rem; }
            .main-btn { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="notification-area"></div>

        <header class="header">
            <div class="nav-container">
                <button class="nav-tab active" onclick="switchTab('click')"><i class="fas fa-mouse-pointer"></i> Клик</button>
                <button class="nav-tab" onclick="switchTab('real-estate')"><i class="fas fa-building"></i> Недвижимость</button>
                <button class="nav-tab" onclick="switchTab('crypto')"><i class="fab fa-bitcoin"></i> Крипто</button>
                <button class="nav-tab" onclick="switchTab('business')"><i class="fas fa-briefcase"></i> Бизнес</button>
                <button class="nav-tab" onclick="switchTab('luxury')"><i class="fas fa-gem"></i> Роскошь</button>
                <button class="nav-tab" onclick="switchTab('tech')"><i class="fas fa-microchip"></i> Технологии</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-wallet" style="color: var(--success)"></i> Текущий Баланс</div>
                <div class="stat-value" id="balance-display">$0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-bolt" style="color: var(--warning)"></i> Доход за клик</div>
                <div class="stat-value" id="click-income-display">$1</div>
                <div class="stat-limit">Лимит: $35k</div>
                <div class="progress-bar"><div class="progress-fill" id="click-progress"></div></div>
            </div>

            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-chart-line" style="color: var(--primary)"></i> Пассивный доход</div>
                <div class="stat-value" id="passive-income-display">$0 / сек</div>
                <div class="stat-limit">Лимит: $500k</div>
                <div class="progress-bar"><div class="progress-fill" id="passive-progress"></div></div>
            </div>
        </div>

        <div class="click-area">
            <button class="main-btn" id="click-btn">
                <i class="fas fa-hand-holding-dollar"></i>
                <span>КЛИКАТЬ</span>
            </button>
        </div>

        <div id="click-tab" class="tab-content active">
            <h2 class="section-title"><i class="fas fa-mouse-pointer"></i> Улучшения Клика</h2>
            <div class="upgrades-grid" id="click-container"></div>
        </div>

        <div id="real-estate-tab" class="tab-content">
            <h2 class="section-title"><i class="fas fa-building"></i> Недвижимость</h2>
            <div class="upgrades-grid" id="real-estate-container"></div>
        </div>

        <div id="crypto-tab" class="tab-content">
            <h2 class="section-title"><i class="fab fa-bitcoin"></i> Крипто Империя</h2>
            <div class="upgrades-grid" id="crypto-container"></div>
        </div>

        <div id="business-tab" class="tab-content">
            <h2 class="section-title"><i class="fas fa-briefcase"></i> Бизнес</h2>
            <div class="upgrades-grid" id="business-container"></div>
        </div>

        <div id="luxury-tab" class="tab-content">
            <h2 class="section-title"><i class="fas fa-gem"></i> Роскошь</h2>
            <div class="upgrades-grid" id="luxury-container"></div>
        </div>

        <div id="tech-tab" class="tab-content">
            <h2 class="section-title"><i class="fas fa-rocket"></i> Будущее</h2>
            <div class="upgrades-grid" id="tech-container"></div>
        </div>
    </div>

    <script>
        // --- Game Configuration & Data ---
        // Лимиты установлены жестко по твоему запросу
        const MAX_CLICK_INCOME = 35000;
        const MAX_PASSIVE_INCOME = 500000;

        const gameData = {
            click: [
                { id: 'c1', name: 'Обучение финансам', desc: 'Начало пути', price: 15, income: 1, max: 50, icon: 'fas fa-book', theme: 'theme-blue' },
                { id: 'c2', name: 'Удобная мышь', desc: 'Улучшает эргономику', price: 100, income: 5, max: 50, icon: 'fas fa-mouse', theme: 'theme-blue' },
                { id: 'c3', name: 'Трейдинг курсы', desc: 'Знание рынка', price: 500, income: 15, max: 40, icon: 'fas fa-chart-bar', theme: 'theme-blue' },
                { id: 'c4', name: 'ИИ Помощник', desc: 'Анализ в реальном времени', price: 2500, income: 50, max: 30, icon: 'fas fa-robot', theme: 'theme-blue' },
                { id: 'c5', name: 'Нейроинтерфейс', desc: 'Мысль быстрее клика', price: 10000, income: 200, max: 25, icon: 'fas fa-brain', theme: 'theme-blue' },
                { id: 'c6', name: 'Квантовый Коннект', desc: 'Слияние с сетью', price: 50000, income: 800, max: 20, icon: 'fas fa-atom', theme: 'theme-blue' },
                { id: 'c7', name: 'Манипуляция Рынком', desc: 'Абсолютная власть', price: 250000, income: 2500, max: 10, icon: 'fas fa-globe', theme: 'theme-blue' }
            ],
            realEstate: [
                { id: 'r1', name: 'Сдача комнаты', desc: 'Пассивный доход с соседа', price: 500, income: 5, max: 50, icon: 'fas fa-bed', theme: 'theme-green' },
                { id: 'r2', name: 'Квартира в центре', desc: 'Стабильный поток', price: 2500, income: 25, max: 30, icon: 'fas fa-building', theme: 'theme-green' },
                { id: 'r3', name: 'Торговый центр', desc: 'Масштабная аренда', price: 15000, income: 100, max: 20, icon: 'fas fa-store', theme: 'theme-green' },
                { id: 'r4', name: 'Небоскреб', desc: 'Символ успеха', price: 100000, income: 600, max: 10, icon: 'fas fa-city', theme: 'theme-green' }
            ],
            crypto: [
                { id: 'cr1', name: 'Майнинг дома', desc: 'Греет комнату', price: 1000, income: 10, max: 50, icon: 'fas fa-server', theme: 'theme-orange' },
                { id: 'cr2', name: 'Крипто-ферма', desc: 'Ангар видеокарт', price: 5000, income: 60, max: 30, icon: 'fas fa-network-wired', theme: 'theme-orange' },
                { id: 'cr3', name: 'Своя Биржа', desc: 'Комиссии с других', price: 50000, income: 400, max: 15, icon: 'fas fa-exchange-alt', theme: 'theme-orange' },
                { id: 'cr4', name: 'NFT Коллекция', desc: 'Цифровое искусство', price: 200000, income: 1500, max: 5, icon: 'fas fa-image', theme: 'theme-orange' }
            ],
            business: [
                { id: 'b1', name: 'Кофейня', desc: 'Бодрый доход', price: 3000, income: 30, max: 40, icon: 'fas fa-coffee', theme: 'theme-purple' },
                { id: 'b2', name: 'IT Стартап', desc: 'Рискованно, но прибыльно', price: 12000, income: 150, max: 25, icon: 'fas fa-laptop-code', theme: 'theme-purple' },
                { id: 'b3', name: 'Авиакомпания', desc: 'Полеты по миру', price: 150000, income: 1200, max: 10, icon: 'fas fa-plane', theme: 'theme-purple' },
                { id: 'b4', name: 'Нефтяная Вышка', desc: 'Черное золото', price: 800000, income: 5000, max: 5, icon: 'fas fa-oil-well', theme: 'theme-purple' }
            ],
            luxury: [
                { id: 'l1', name: 'Спорткар', desc: 'Скорость и стиль', price: 50000, income: 300, max: 10, icon: 'fas fa-car', theme: 'theme-pink' },
                { id: 'l2', name: 'Яхта', desc: 'Вечеринки в море', price: 250000, income: 1500, max: 5, icon: 'fas fa-ship', theme: 'theme-pink' },
                { id: 'l3', name: 'Частный Остров', desc: 'Свое государство', price: 2000000, income: 10000, max: 3, icon: 'fas fa-umbrella-beach', theme: 'theme-pink' },
                { id: 'l4', name: 'Футбольный Клуб', desc: 'Игрушка миллиардера', price: 10000000, income: 40000, max: 2, icon: 'fas fa-futbol', theme: 'theme-pink' }
            ],
            tech: [
                { id: 't1', name: 'Космический Отель', desc: 'Отдых на орбите', price: 5000000, income: 25000, max: 5, icon: 'fas fa-satellite', theme: 'theme-blue' },
                { id: 't2', name: 'База на Марсе', desc: 'Колонизация', price: 25000000, income: 80000, max: 3, icon: 'fas fa-user-astronaut', theme: 'theme-blue' },
                { id: 't3', name: 'Сфера Дайсона', desc: 'Энергия звезды', price: 100000000, income: 150000, max: 1, icon: 'fas fa-sun', theme: 'theme-warning' } // 150k + другие = 500k
            ]
        };

        // State
        let gameState = {
            money: 0,
            upgrades: {}
        };

        // --- Core Functions ---

        function init() {
            loadGame();
            renderAllTabs();
            updateUI();

            // Auto-save every 10 sec
            setInterval(saveGame, 10000);

            // Passive income tick (every 1 sec)
            setInterval(() => {
                const stats = calculateStats();
                if (stats.passive > 0) {
                    addMoney(stats.passive);
                }
            }, 1000);
        }

        function calculateStats() {
            let clickIncome = 1;
            let passiveIncome = 0;

            // Calculate Click
            gameData.click.forEach(item => {
                const level = gameState.upgrades[item.id] || 0;
                clickIncome += level * item.income;
            });

            // Calculate Passive
            ['realEstate', 'crypto', 'business', 'luxury', 'tech'].forEach(cat => {
                gameData[cat].forEach(item => {
                    const level = gameState.upgrades[item.id] || 0;
                    passiveIncome += level * item.income;
                });
            });

            // Apply Hard Limits
            if (clickIncome > MAX_CLICK_INCOME) clickIncome = MAX_CLICK_INCOME;
            if (passiveIncome > MAX_PASSIVE_INCOME) passiveIncome = MAX_PASSIVE_INCOME;

            return { click: clickIncome, passive: passiveIncome };
        }

        function getPrice(item) {
            const level = gameState.upgrades[item.id] || 0;
            // Цена растет на 15% за каждый уровень
            return Math.floor(item.price * Math.pow(1.15, level));
        }

        function addMoney(amount) {
            gameState.money += amount;
            updateUI();
        }

        // --- UI Rendering ---

        function formatMoney(num) {
            if (num >= 1000000000) return '$' + (num / 1000000000).toFixed(2) + 'B';
            if (num >= 1000000) return '$' + (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return '$' + (num / 1000).toFixed(1) + 'k';
            return '$' + Math.floor(num).toLocaleString();
        }

        function updateUI() {
            const stats = calculateStats();

            // Text updates
            document.getElementById('balance-display').innerText = formatMoney(gameState.money);
            document.getElementById('click-income-display').innerText = formatMoney(stats.click);
            document.getElementById('passive-income-display').innerText = formatMoney(stats.passive) + ' / сек';

            // Progress Bars
            const clickPercent = (stats.click / MAX_CLICK_INCOME) * 100;
            const passivePercent = (stats.passive / MAX_PASSIVE_INCOME) * 100;

            document.getElementById('click-progress').style.width = `${Math.min(clickPercent, 100)}%`;
            document.getElementById('passive-progress').style.width = `${Math.min(passivePercent, 100)}%`;

            // Button updates
            document.querySelectorAll('.buy-btn').forEach(btn => {
                const price = parseInt(btn.dataset.price);
                const id = btn.dataset.id;
                const max = parseInt(btn.dataset.max);
                const currentLevel = gameState.upgrades[id] || 0;

                if (currentLevel >= max) {
                    btn.disabled = true;
                    btn.innerHTML = 'МАКС <i class="fas fa-check"></i>';
                } else if (gameState.money >= price) {
                    btn.disabled = false;
                } else {
                    btn.disabled = true;
                }
            });
        }

        function renderAllTabs() {
            renderSection(gameData.click, 'click-container');
            renderSection(gameData.realEstate, 'real-estate-container');
            renderSection(gameData.crypto, 'crypto-container');
            renderSection(gameData.business, 'business-container');
            renderSection(gameData.luxury, 'luxury-container');
            renderSection(gameData.tech, 'tech-container');
        }

        function renderSection(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            data.forEach(item => {
                const currentLevel = gameState.upgrades[item.id] || 0;
                const price = getPrice(item);

                const card = document.createElement('div');
                card.className = `card ${item.theme}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon"><i class="${item.icon}"></i></div>
                        <div class="card-info">
                            <h3>${item.name}</h3>
                            <div class="card-desc">${item.desc}</div>
                        </div>
                    </div>
                    <div class="card-stats">
                        <div class="stat-box">
                            <small>Уровень</small>
                            <strong>${currentLevel}/${item.max}</strong>
                        </div>
                        <div class="stat-box">
                            <small>Доход</small>
                            <strong>+${formatMoney(item.income)}</strong>
                        </div>
                    </div>
                    <button class="buy-btn"
                        data-id="${item.id}"
                        data-price="${price}"
                        data-max="${item.max}"
                        onclick="buyUpgrade('${item.id}')">
                        <span>Купить</span>
                        <span>${formatMoney(price)}</span>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // --- Interaction ---

        window.switchTab = function(tabName) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            event.currentTarget.classList.add('active');

            // Map tab name to IDs
            let id = tabName;
            if(!id.includes('tab')) id += '-tab';

            const target = document.getElementById(id);
            if(target) target.classList.add('active');
        };

        window.buyUpgrade = function(id) {
            // Find item in all categories
            let item = null;
            for (const key in gameData) {
                const found = gameData[key].find(i => i.id === id);
                if (found) { item = found; break; }
            }

            if (!item) return;

            const price = getPrice(item);
            const currentLevel = gameState.upgrades[id] || 0;

            if (gameState.money >= price && currentLevel < item.max) {
                gameState.money -= price;
                gameState.upgrades[id] = currentLevel + 1;

                showNotification(`Куплено: ${item.name}`, 'success');

                // Re-render only the affected section to update price
                // For simplicity in this version, we re-render all to keep prices accurate
                renderAllTabs();
                updateUI();
                saveGame();
            }
        };

        // Click Handler
        document.getElementById('click-btn').addEventListener('click', (e) => {
            const stats = calculateStats();
            addMoney(stats.click);

            // Animation for button
            const btn = document.getElementById('click-btn');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => btn.style.transform = 'scale(1)', 50);

            // Floating text
            createFloatingText(e.clientX, e.clientY, `+$${formatMoney(stats.click)}`);
        });

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;

            // Random jitter
            const jitterX = (Math.random() - 0.5) * 40;

            el.style.left = (x + jitterX) + 'px';
            el.style.top = (y - 20) + 'px';

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function showNotification(msg, type) {
            const area = document.getElementById('notification-area');
            const toast = document.createElement('div');
            toast.className = 'notify-toast';
            toast.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
            area.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // --- Save System ---
        function saveGame() {
            localStorage.setItem('financeEmpireSave_v2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('financeEmpireSave_v2');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameState = { ...gameState, ...parsed };
                } catch (e) {
                    console.error("Save file corrupted");
                }
            }
        }

        // Start
        init();

    </script>
</body>
</html>
